server:
  forward-headers-strategy: framework
  address: 0.0.0.0
  port: ${PORT:8080}
  tomcat:
    # ✅ 업로드 중 스트림 조기 종료(EOF) 막기 위해 제한 해제
    max-swallow-size: -1
    # ✅ 폼 포스트 최대 크기 제한 해제 (Tomcat 레벨)
    max-http-form-post-size: -1
  # ✅ 업로드 오래 걸릴 때 타임아웃 늘리기 (5분)
  connection-timeout: 300000

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration-time: 3600000
  refresh-token-expiration-time: 86400000

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      enabled: true
      # ✅ 스프링 레벨 업로드 한도 크게
      max-file-size: 2GB
      max-request-size: 2GB
      # ✅ 업로드 즉시 디스크로 내려서 메모리 폭주 방지
      file-size-threshold: 0

  # ✅ 비동기 요청(업로드 처리 등) 타임아웃 늘리기
  mvc:
    async:
      request-timeout: 300s

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            scope: user:email
            redirect-uri: "https://api.diff.io.kr/login/oauth2/code/github"
            client-name: GitHub
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "https://api.diff.io.kr/login/oauth2/code/google"
        provider:
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis:
  type-aliases-package: org.example.vo
  mapper-locations: classpath:/mappers/**/*.xml

logging:
  level:
    root: WARN
    com.example.demo: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO

sonarqube:
  host: ${SONARQUBE_HOST}
  token: ${SONARQUBE_TOKEN}

openai:
  api:
    key: ${OPENAI_KEY}

notion:
  secret: ${NOTION_SECRET}
  database-id: ${NOTION_DB}
  report-secret: ${NOTION_REPORT_SECRET}
  report-database-id: ${NOTION_REPORT_DB}

fcm:
  key: ${FIREBASE_KEY}
